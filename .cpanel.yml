---
# cPanel > Git Version Control > "Deploy HEAD Commit" par chalta hai.
# Repo jis folder mein clone hai, wahi app folder hai (document root = <repo>/public).
# .env server par ek baar khud banana hai; git use touch nahi karta.
deployment:
  tasks:
    - export REPOPATH=$(pwd)
    - cd $REPOPATH && /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction
    - cd $REPOPATH && /usr/local/bin/php artisan migrate --force
    - cd $REPOPATH && /usr/local/bin/php artisan optimize:clear
    - cd $REPOPATH && /usr/local/bin/php artisan optimize
