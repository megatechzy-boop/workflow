---
# cPanel > Git Version Control > Update from Remote > Deploy HEAD Commit
# Repo (~/repositories/workflow) se app files live folder (~/workflow) mein copy karta hai.
# shortcut: vendor/ copy nahi hota (server par composer nahi hai); composer.lock badle toh nayi vendor ZIP upload karni hogi.
deployment:
  tasks:
    - export DEPLOYPATH=/home2/megatechzy/workflow
    - export PHP=/opt/alt/php85/usr/bin/php
    - /bin/cp -R app bootstrap config database public resources routes artisan composer.json composer.lock $DEPLOYPATH/
    - cd $DEPLOYPATH && $PHP artisan migrate --force
    - cd $DEPLOYPATH && $PHP artisan optimize:clear
