<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Offline · MegaTechzy</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; background: #f9fafb; color: #111827; text-align: center; padding: 24px; }
        img { width: 72px; height: 72px; border-radius: 18px; }
        h1 { font-size: 20px; margin: 16px 0 6px; }
        p { color: #6b7280; margin: 0 0 20px; }
        button { background: #0A7A6C; color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-size: 16px; font-weight: 600; }
    </style>
</head>
<body>
    <div>
        <img src="/icons/icon-192.png" alt="MegaTechzy">
        <h1>You are offline</h1>
        <p>Check your internet connection and try again.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
    <script>
        // Back online: open the page again by itself
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
